<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fase 0 · Three.js puro</title>

    <style>
      /* El canvas ocupa toda la ventana: sin margen del body y sin barras de scroll. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
      }

      /* Three.js inserta un <canvas>; por defecto es inline y deja un hueco debajo. */
      canvas {
        display: block;
      }
    </style>

    <!--
      IMPORT MAP

      El navegador no sabe qué es 'three': no es una URL ni una ruta relativa.
      Sin bundler ni node_modules, esta tabla es lo que traduce el nombre a una URL.

      Va ANTES de cualquier <script type="module"> que lo use.
      Versión fijada, nunca 'latest': Three.js rompe cosas entre versiones menores.

      Ojo: three.module.js NO es autocontenido — importa './three.core.js' como archivo
      hermano. Funciona porque unpkg sirve los dos desde la misma carpeta. Si algún día
      cambias de CDN, comprueba que también sirva el hermano o el import fallará.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.186.0/build/three.module.js"
        }
      }
    </script>
  </head>

  <body>
    <!-- Aquí montaremos la escena en la issue #2. -->
    <div id="app"></div>

    <script type="module">
      import * as THREE from 'three';

      // Si esto imprime 186, el import map funcionó y la librería está cargada.
      console.log('Three.js revisión:', THREE.REVISION);

      // ---------------------------------------------------------------------
      // LOS TRES OBJETOS BASE
      //
      // Como un rodaje:
      //   Scene    → el plató: contiene todo lo que existe
      //   Camera   → la cámara: desde dónde y con qué apertura se mira
      //   Renderer → el equipo que graba: toma escena + cámara y pinta
      // ---------------------------------------------------------------------

      // 1. LA ESCENA -------------------------------------------------------
      const scene = new THREE.Scene();

      // Color de fondo. Sin esto el canvas sería transparente y no sabríamos
      // si el renderer está pintando o simplemente no hace nada.
      scene.background = new THREE.Color(0x0d1b2a);

      // 2. LA CÁMARA -------------------------------------------------------
      const camera = new THREE.PerspectiveCamera(
        75, // FOV: campo de visión vertical en grados. 50-75 es lo habitual.
        window.innerWidth / window.innerHeight, // proporción del canvas
        0.1, // near: más cerca de esto, no se dibuja
        1000, // far:  más lejos de esto, tampoco
      );

      // ⚠️ La cámara nace en el origen (0,0,0). Si dejáramos ahí un objeto,
      // la cámara quedaría DENTRO de él y no veríamos nada. La separamos.
      //
      // Three.js usa Y-up: X a la derecha, Y arriba, Z hacia el espectador.
      // Por eso z = 5 aleja la cámara en nuestra dirección.
      camera.position.z = 5;

      // 3. EL RENDERER -----------------------------------------------------
      // antialias suaviza los bordes escalonados de la geometría.
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Limita la densidad de píxeles. En pantallas de alta densidad el
      // navegador renderizaría a 3x, que es 9 veces más píxeles sin que se
      // note apenas. Volverá a aparecer en la issue #45 (rendimiento).
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // El renderer crea su propio <canvas>; hay que insertarlo en el DOM.
      document.getElementById('app').appendChild(renderer.domElement);

      // 4. LA ESFERA -------------------------------------------------------
      //
      // Todo objeto visible en Three.js son dos piezas combinadas:
      //   Geometry → la forma: dónde están los vértices   (el esqueleto)
      //   Material → el aspecto: color, brillo, luz       (la piel)
      //   Mesh     → geometry + material, ya colocable    (el cuerpo)
      //
      // Se separan para poder reutilizar: una misma geometría puede
      // compartirse entre varios meshes con materiales distintos.

      // Una esfera perfecta no existe en 3D: se aproxima con triángulos.
      // Los segmentos dicen cuántos.
      //   8   → claramente poligonal
      //   32  → suave; el equilibrio habitual
      //   128 → apenas mejor que 32, bastante más pesado
      // Pruébalo: cambia el 32 por 8 y por 64 para verlo.
      const geometry = new THREE.SphereGeometry(1, 32, 32);

      // MeshStandardMaterial SÍ obedece a la luz. Hasta la issue 0-4 usábamos
      // MeshBasicMaterial, que la ignora: por eso la esfera se veía como un
      // disco plano. El cerebro deduce el volumen de cómo cae la luz, y sin
      // esas pistas una esfera y un círculo son visualmente idénticos.
      //
      // ⚠️ PRUEBA ESTO: comenta las dos luces de más abajo y recarga. La
      // esfera se verá NEGRA. No está rota — es correcto: un objeto que solo
      // se ve por la luz que refleja, sin luz, no refleja nada.
      //
      // PBR = Physically Based Rendering: simula cómo se comporta la luz en el
      // mundo real. Dos parámetros principales:
      //   roughness (0-1) → 0 es un espejo pulido, 1 es tiza
      //   metalness (0-1) → si el material es metálico
      //
      // Three.js usa hexadecimal (0x3366ff), no cadenas ("#3366ff").
      const material = new THREE.MeshStandardMaterial({
        color: 0x4da3ff,
        roughness: 0.8, // alto: superficie mate, como tendrá la Tierra
        metalness: 0.0, // un planeta no es metálico
        // wireframe: true,  ← descoméntalo para ver la malla de triángulos
      });

      const sphere = new THREE.Mesh(geometry, material);

      // ⚠️ Sin esta línea la esfera existe, pero no está en la escena: no se
      // dibuja y no hay ningún error que lo avise.
      scene.add(sphere);

      // 5. LAS LUCES -------------------------------------------------------
      //
      // Sin luces, un MeshStandardMaterial se ve negro. Estas dos hacen que
      // la esfera pase de disco plano a objeto con volumen.

      // DirectionalLight: rayos PARALELOS desde una dirección, como el Sol a
      // distancia infinita. A 150 millones de km, sus rayos llegan a la
      // Tierra prácticamente paralelos, así que el modelo es correcto.
      //
      // Lo que importa es la DIRECCIÓN, no la distancia: position solo define
      // desde dónde apunta. [5,3,5] y [50,30,50] iluminan idéntico.
      const sun = new THREE.DirectionalLight(0xffffff, 3);
      sun.position.set(5, 3, 5);
      scene.add(sun);

      // AmbientLight: ilumina todo por igual, desde ninguna dirección. No crea
      // volumen; solo evita que la zona en sombra sea negro absoluto.
      //
      // ⚠️ No la subas para "ver mejor" el lado oscuro: aplasta el degradado
      // y se pierde justo el efecto que buscamos.
      const ambient = new THREE.AmbientLight(0xffffff, 0.15);
      scene.add(ambient);

      // ── Por qué esto ya es el día y la noche ──────────────────────────
      //
      // Una esfera iluminada por una luz direccional tiene, por PURA
      // GEOMETRÍA, una mitad iluminada y otra en sombra, con un degradado
      // suave entre ambas. Ese degradado ES el terminador terrestre, la línea
      // real que separa el día de la noche.
      //
      // En la Fase 2 no habrá que programar ningún ciclo día/noche: basta con
      // colocar la luz. Lo que sí habrá que calcular es la posición real del
      // Sol según la fecha y la hora.

      // 6. EL BUCLE DE ANIMACIÓN -------------------------------------------
      //
      // Hasta ahora la escena se pintaba UNA vez. Para que algo se mueva hay
      // que redibujar constantemente. Este bucle es el motor de toda
      // aplicación 3D interactiva; en la Fase 3 será el que mueva la ISS.

      // Timer mide el tiempo entre fotogramas. Ver más abajo por qué importa.
      //
      // Sustituye a THREE.Clock, que está DEPRECADO desde r186. Una API
      // deprecada sigue funcionando, pero su autor avisa de que dejará de
      // mantenerse y acabará desapareciendo: es una cuenta atrás, no un error.
      const timer = new THREE.Timer();

      // Velocidad expresada POR SEGUNDO, no por fotograma.
      // 0.5 rad/s ≈ una vuelta completa cada 12.5 s (2π / 0.5).
      const ROTATION_SPEED = 0.5;

      function animate() {
        // Pide al navegador ejecutar animate() antes del siguiente repintado.
        //
        // ¿Por qué no setInterval(animate, 16)?
        //   · rAF se sincroniza con el refresco real: sin parpadeos.
        //   · Se PAUSA solo si la pestaña pasa a segundo plano; setInterval
        //     seguiría gastando batería dibujando algo que nadie ve.
        //   · Se adapta a pantallas de 120 Hz o 144 Hz.
        requestAnimationFrame(animate);

        // ⚠️ EL PUNTO DE ESTA ISSUE: delta time.
        //
        // Escribir `sphere.rotation.y += 0.01` haría girar la esfera el DOBLE
        // de rápido en un monitor de 120 Hz que en uno de 60 Hz: el mismo
        // código, distinta velocidad según el hardware.
        //
        // getDelta() devuelve los segundos transcurridos desde el fotograma
        // anterior (~0.016 s a 60 fps, ~0.008 s a 120 fps). Al multiplicar,
        // el resultado es el mismo en cualquier pantalla.
        //
        // No es cosmético: en la Fase 3, con posiciones reales de la ISS, un
        // movimiento atado al framerate daría una velocidad orbital errónea.
        //
        // ⚠️ update() PRIMERO. Es la diferencia con el antiguo Clock: sin esta
        // llamada, getDelta() devuelve siempre 0 y la animación se queda
        // congelada, sin ningún error que lo explique.
        timer.update();
        const delta = timer.getDelta();

        // rotation se mide en RADIANES, no en grados.
        // Una vuelta completa son 2π ≈ 6.28, no 360.
        // Para convertir: THREE.MathUtils.degToRad(45)
        //
        // Rotar sobre Y gira alrededor del eje vertical, que es exactamente
        // lo que hace la Tierra. Ese detalle vuelve en la issue #22.
        sphere.rotation.y += ROTATION_SPEED * delta;

        renderer.render(scene, camera);
      }

      // Arrancar el bucle. Sin esta llamada, animate() nunca se ejecuta.
      animate();

      // 7. REDIMENSIONADO --------------------------------------------------
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;

        // ⚠️ Obligatorio: cambiar 'aspect' a secas no hace nada, porque la
        // matriz de proyección ya estaba calculada con el valor anterior.
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);

        // Ya no hace falta repintar a mano aquí: desde la issue #4 el bucle
        // de animación redibuja 60 veces por segundo, así que el cambio de
        // tamaño se refleja en el siguiente fotograma.
      });
    </script>
  </body>
</html>
