<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Debe coincidir con MOBILE_PERFORMANCE_MEDIA_QUERY. test:preloads lo protege. -->
    <link
      rel="preload"
      as="image"
      href="/textures/earth-color-mobile.jpg"
      media="(max-width: 599.95px), (max-height: 500px) and (pointer: coarse)"
    />
    <link
      rel="preload"
      as="image"
      href="/textures/earth-night-mobile.jpg"
      media="(max-width: 599.95px), (max-height: 500px) and (pointer: coarse)"
    />
    <link
      rel="preload"
      as="image"
      href="/textures/earth-normal-mobile.jpg"
      media="(max-width: 599.95px), (max-height: 500px) and (pointer: coarse)"
    />
    <link
      rel="preload"
      as="image"
      href="/textures/earth-specular-mobile.jpg"
      media="(max-width: 599.95px), (max-height: 500px) and (pointer: coarse)"
    />
    <meta name="theme-color" content="#05060a" />
    <title>ISS Tracker · Jonathan Siesquen</title>
    <meta
      name="description"
      content="Seguimiento en tiempo real de la ISS sobre un globo 3D con SGP4."
    />
    <!-- Open Graph: HTML estático — el rastreador no ejecuta JS (social-card) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://iss-tracker-siesquen.vercel.app/" />
    <meta property="og:title" content="ISS Tracker" />
    <meta
      property="og:description"
      content="Seguimiento en tiempo real de la ISS sobre un globo 3D con SGP4."
    />
    <meta property="og:image" content="https://iss-tracker-siesquen.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
