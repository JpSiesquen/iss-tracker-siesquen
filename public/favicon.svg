<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ISS Tracker">
  <!-- Espacio: mismo tono que SPACE_COLOR -->
  <rect width="32" height="32" rx="6" fill="#05060a"/>
  <!-- Globo sugerido, sin textura: solo silueta -->
  <circle cx="16" cy="16" r="7.2" fill="#1a2a3d"/>
  <!-- Órbita: azul de la traza pasada -->
  <ellipse
    cx="16"
    cy="16"
    rx="12.5"
    ry="5.2"
    fill="none"
    stroke="#5eb0ff"
    stroke-width="1.4"
    transform="rotate(-28 16 16)"
  />
  <!-- ISS: acento amarillo del marcador -->
  <circle cx="26.2" cy="11.4" r="2.4" fill="#ffcc00"/>
</svg>
